# This workflow does a clean installation of node dependencies, builds the source
# code and runs the checks.

name: Angular Checks

on: []

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        # The runner filesystem is case sensitive; the directory is 'angular'.
        working-directory: ./angular/

    strategy:
      matrix:
        # Angular 21 requires Node ^20.19 || ^22.12 || >=24
        node-version: ['24']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned by the 'packageManager' field in package.json.
      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: './angular/pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build --if-present
      - run: pnpm exec prettier --check src/app
      - run: pnpm run lint