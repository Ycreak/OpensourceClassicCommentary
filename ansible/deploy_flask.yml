---
- name: Deploy Flask application to Dux
  hosts: dux
  vars:
    # Use a trailing slash on src to sync the CONTENTS of the folder
    src_dir: "../flask/"
    dest_dir: "/home/luukie/servers/oscc/flask"

  tasks:
    - name: Ensure destination directory exists
      file:
        path: "{{ dest_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy application (excluding cache and .env)
      synchronize:
        src: "{{ src_dir }}"
        dest: "{{ dest_dir }}"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=cache/"
          - "--exclude=.env"
          - "--exclude=__pycache__/"
          - "--chmod=D755,F644"
