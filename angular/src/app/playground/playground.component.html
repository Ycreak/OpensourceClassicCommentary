<div id="playground" class="container-fluid playground-height-padding">
  @if (this.api.spinner) {
    <mat-progress-bar mode="query"></mat-progress-bar>
  }

  @if (this.websockets.active) {
    <p>
      Current room: <b>{{ this.websockets.room_identifier }}</b>
    </p>
  }

  <div class="canvas-container">
    <canvas id="playground_canvas"></canvas>

    <!--Popup window with options for the documents-->
    @if (this.fabric.has_selection()) {
      <div class="menu">
        <div class="br-icon" (click)="this.fabric.delete_selected()">
          <mat-icon class="menu-icon">backspace</mat-icon> delete objects
        </div>
        <div class="br-icon" (click)="this.request_commentary()">
          <mat-icon class="menu-icon">notes</mat-icon> commentary
        </div>
      </div>
    }

    <div id="playground-main-toolbar" class="playground-toolbar">
      <!-- Hamburger menu -->
      <div id="playground-hamburger-menu" class="playground-tool-group">
        <button id="playground-hamburger-menu-button" mat-stroked-button class="navbar" [matMenuTriggerFor]="menu">
          <mat-icon fontIcon="menu"></mat-icon>
        </button>
      </div>
      <div id="playground-document-tools" class="playground-tool-group">
        <!-- <span id="playground_addfragment_btn_tooltip" class="playground_btn_tooltip">
        <app-latin-tragic-fragment-filter
          [button_title]="''"
          [button_type]="'playground'"
          [endpoint]="'editor'"
          (new_filter)="this.request_documents($event)">
        </app-latin-tragic-fragment-filter>
      </span> -->
      <span id="playground_searchfragment_btn_tooltip" class="playground_btn_tooltip">
        <img
          id="playground_authors_btn"
          class="playground-icon"
          [src]="playgroundSearchFragmentButton"
          (click)="this.open_advanced_filter()" />
      </span>
      <span id="playground_addnote_btn_tooltip" class="playground_btn_tooltip">
        <img
          id="playground_note_btn"
          class="playground-icon"
          [src]="playgroundAddNoteButton"
          (click)="this.fabric.add_note('edit me')" />
      </span>
      <span id="playground_clear_btn_tooltip" class="playground_btn_tooltip">
        <img
          id="playground_clear_btn"
          class="playground-icon"
          [src]="playgroundClearButton"
          (click)="this.open_clear_playground()" />
      </span>
    </div>

    <div id="playground-drawing-tools" class="playground-tool-group">
      <span id="playground_draw_btn_tooltip" class="playground_btn_tooltip">
        <img
          id="playground_draw_btn"
          class="playground-icon"
          [src]="playgroundDrawButton"
          (click)="this.fabric.toggle_drawing_mode()" />
      </span>
      <!--<img-->
      <!--id="playground_arrow_btn"-->
      <!--class="playground-icon"-->
      <!--src="assets\icons\ByteDanceIconPark\9068687_arrow_right_up_icon.png" />-->
      <!--<img-->
      <!--id="playground_line_btn"-->
      <!--class="playground-icon"-->
      <!--src="assets\icons\ByteDanceIconPark\9069299_line_icon.png" />-->
      <!--<img-->
      <!--id="playground_rectangle_btn"-->
      <!--class="playground-icon"-->
      <!--src="assets\icons\ByteDanceIconPark\9070071_square_icon.png" />-->
    </div>

    <div id="playground-history-tools" class="playground-tool-group">
      <span id="playground_undo_btn_tooltip" class="playground_btn_tooltip">
        <img
          id="playground_undo_btn"
          class="playground-icon"
          [src]="playgroundUndoButton"
          (click)="this.fabric.undo()" />
      </span>
      <span id="playground_redo_btn_tooltip" class="playground_btn_tooltip">
        <img
          id="playground_redo_btn"
          class="playground-icon"
          [src]="playgroundRedoButton"
          (click)="this.fabric.redo()" />
      </span>
    </div>

    @if (this.auth_service.is_logged_in) {
      <div id="playground-load-save-tools" class="playground-tool-group">
        <img
          id="playground_save_btn"
          class="playground-icon"
          [src]="playgroundSaveButton"
          (click)="this.save_playground()" />
        <img
          id="playground_load_btn"
          class="playground-icon"
          [src]="playgroundLoadButton"
          (click)="this.load_playground()" />
        @if (this.role === 'owner') {
          <img
            id="playground_delete_btn"
            class="playground-icon"
            [src]="playgroundDeleteButton"
            (click)="this.delete_playground()" />
        }
      </div>
    }

  <button mat-menu-item (click)="this.load_playground()">
    <div class="menu-item-icon-wrapper">
      <img id="playground_load_btn" class="playground-icon" [src]="playgroundLoadButton" />
    </div>
    Load Playground
  </button>
  <button mat-menu-item (click)="this.save_playground()">
    <div class="menu-item-icon-wrapper">
      <img id="playground_save_btn" class="playground-icon" [src]="playgroundSaveButton" />
    </div>
    Save Playground
  </button>
