<div id="playground" class="container-fluid playground-height-padding">
  <mat-progress-bar mode="query" *ngIf="this.api.spinner"></mat-progress-bar>

  <p *ngIf="this.websockets.active">
    Current room: <b>{{ this.websockets.room_identifier }}</b>
  </p>

  <div class="canvas-container">
    <canvas id="playground_canvas"></canvas>

    <!--Popup window with options for the documents-->
    <div class="menu" *ngIf="this.fabric.has_selection()">
      <div class="br-icon" (click)="this.fabric.delete_selected()">
        <app-playground-icon name="delete-object" class="menu-icon"></app-playground-icon> delete objects
      </div>
      <div class="br-icon" (click)="this.request_commentary()">
        <app-playground-icon name="commentary" class="menu-icon"></app-playground-icon> commentary
      </div>
    </div>

    <div id="playground-main-toolbar" class="playground-toolbar">
      <!-- Hamburger menu -->
      <div id="playground-hamburger-menu" class="playground-tool-group">
        <button id="playground-hamburger-menu-button" mat-stroked-button class="navbar" [matMenuTriggerFor]="menu">
          <mat-icon fontIcon="menu"></mat-icon>
        </button>
      </div>
      <div id="playground-document-tools" class="playground-tool-group">
        <app-latin-tragic-fragment-filter
          [button_title]="''"
          [button_type]="'playground'"
          [endpoint]="'editor'"
          (new_filter)="this.request_documents($event)">
        </app-latin-tragic-fragment-filter>
        <app-playground-icon
          id="playground_authors_btn"
          class="playground-icon"
          name="author-search"
          (click)="this.open_advanced_filter()"></app-playground-icon>
        <app-playground-icon
          id="playground_note_btn"
          class="playground-icon"
          name="note"
          (click)="this.fabric.add_note('edit me')"></app-playground-icon>
        <app-playground-icon
          id="playground_clear_btn"
          class="playground-icon"
          name="clear"
          (click)="this.open_clear_playground()"></app-playground-icon>
      </div>

      <div id="playground-drawing-tools" class="playground-tool-group">
        <app-playground-icon
          id="playground_draw_btn"
          class="playground-icon"
          name="draw"
          (click)="this.fabric.toggle_drawing_mode()"></app-playground-icon>
        <!--<img-->
        <!--id="playground_arrow_btn"-->
        <!--class="playground-icon"-->
        <!--src="assets\icons\ByteDanceIconPark\9068687_arrow_right_up_icon.png" />-->
        <!--<img-->
        <!--id="playground_line_btn"-->
        <!--class="playground-icon"-->
        <!--src="assets\icons\ByteDanceIconPark\9069299_line_icon.png" />-->
        <!--<img-->
        <!--id="playground_rectangle_btn"-->
        <!--class="playground-icon"-->
        <!--src="assets\icons\ByteDanceIconPark\9070071_square_icon.png" />-->
      </div>

      <div id="playground-history-tools" class="playground-tool-group">
        <app-playground-icon
          id="playground_undo_btn"
          class="playground-icon"
          name="undo"
          (click)="this.fabric.undo()"></app-playground-icon>
        <app-playground-icon
          id="playground_redo_btn"
          class="playground-icon"
          name="redo"
          (click)="this.fabric.redo()"></app-playground-icon>
      </div>

      <div id="playground-load-save-tools" class="playground-tool-group" *ngIf="this.auth_service.is_logged_in">
        <app-playground-icon
          id="playground_save_btn"
          class="playground-icon"
          name="save"
          (click)="this.save_playground()"></app-playground-icon>
        <app-playground-icon
          id="playground_load_btn"
          class="playground-icon"
          name="load"
          (click)="this.load_playground()"></app-playground-icon>
        <app-playground-icon
          *ngIf="this.role === 'owner'"
          id="playground_delete_btn"
          class="playground-icon"
          name="delete-playground"
          (click)="this.delete_playground()"></app-playground-icon>
      </div>
      <div id="playground-sharing-tools" class="playground-tool-group">
        <app-playground-icon
          *ngIf="this.role === 'owner'"
          id="playground_share_btn"
          class="playground-icon"
          name="share"
          (click)="this.share_playground()"></app-playground-icon>
        <app-playground-icon
          *ngIf="this.auth_service.is_logged_in"
          id="playground_share_btn"
          class="playground-icon"
          name="create-session"
          (click)="this.create_live_room()"></app-playground-icon>
        <app-playground-icon
          *ngIf="this.auth_service.is_logged_in"
          id="playground_join_btn"
          class="playground-icon"
          name="join-session"
          (click)="this.join_playground()"></app-playground-icon>
      </div>
      <div id="playground-help-menu" class="playground-tool-group">
        <button id="playground-help-menu-button" mat-stroked-button class="navbar" [matMenuTriggerFor]="helpmenu">
          <mat-icon fontIcon="question_mark"></mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
<!-- Hamburger menu content -->
<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="this.load_playground()">
    <div class="menu-item-icon-wrapper">
      <app-playground-icon
        id="playground_load_btn"
        class="playground-icon"
        name="load"></app-playground-icon>
    </div>
    Load Playground
  </button>
  <button mat-menu-item (click)="this.save_playground()">
    <div class="menu-item-icon-wrapper">
      <app-playground-icon
        id="playground_save_btn"
        class="playground-icon"
        name="save"></app-playground-icon>
    </div>
    Save Playground
  </button>
  <button mat-menu-item (click)="this.create_live_room()">
    <div class="menu-item-icon-wrapper">
      <app-playground-icon
        *ngIf="this.auth_service.is_logged_in"
        id="playground_share_btn"
        class="playground-icon"
        name="create-session"></app-playground-icon>
    </div>
    Create Shared Session
  </button>
  <button mat-menu-item (click)="this.join_playground()">
    <div class="menu-item-icon-wrapper">
      <app-playground-icon
        *ngIf="this.auth_service.is_logged_in"
        id="playground_join_btn"
        class="playground-icon"
        name="join-session"></app-playground-icon>
    </div>
    Join Shared Session
  </button>
  <button mat-menu-item (click)="fabric.randomize_positions()">
    <div class="menu-item-icon-wrapper"></div>
    Scatter documents
  </button>
  <button mat-menu-item>
    <div class="menu-item-icon-wrapper"></div>
    Settings
  </button>
</mat-menu>

<mat-menu #helpmenu="matMenu">
  <button mat-menu-item (click)="this.show_helpmenu('a')">What is the playground</button>
  <button mat-menu-item (click)="this.show_helpmenu('b')">How to use the playground</button>
</mat-menu>
