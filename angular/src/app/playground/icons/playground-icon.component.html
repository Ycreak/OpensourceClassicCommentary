<ng-container [ngSwitch]="strategy?.kind">
  <img *ngSwitchCase="'png'" [src]="strategy?.value" />
  <mat-icon *ngSwitchCase="'mat'" [fontIcon]="strategy?.value"></mat-icon>
  <span *ngSwitchCase="'msym'" class="material-symbols-outlined" [style.font-size.px]="size">{{ strategy?.value }}</span>
</ng-container>
