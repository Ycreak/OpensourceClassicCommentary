services:
  couchdb:
    build:
      context: ./couchdb
      dockerfile: Dockerfile
    # CouchDB is only reachable by the flask container over the compose
    # network and by localhost (for admin maintenance). 
    # Do not expose database port publicly: it would bypass the Flask API auth entirely.
    ports:
      - "127.0.0.1:5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-secret}
    volumes:
      - ./couchdb/data:/opt/couchdb/data

  flask:
    build:
      context: ./flask
      dockerfile: Dockerfile
    ports:
      - "5003:5000"
    volumes:
      - ./flask:/app
    environment:
      - PYTHONPATH=/app

  angular:
    build:
      context: ./angular
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./angular:/app
    command: ["ng", "serve", "--host", "0.0.0.0", "--port", "4200"]

